server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8001;
    }

    location /api/products/ {
        proxy_pass http://product-service:8002;
    }

    location /api/inventory/ {
        proxy_pass http://order-service:8003;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8004;
    }

    location /api/payments/ {
        proxy_pass http://payment-service:8005;
    }

}