name: FailSafe CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Confirm runner
      run: echo "FailSafe CI is running"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check services scripts tests
  
  unit-tests:
    runs-on: ubuntu-latest
    env:
        AUTH_SECRET_KEY: ci-test-key
        DATABASE_URL: sqlite+pysqlite:///:memory:
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - name: Install server dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          for req in services/*/requirements.txt; do
            python -m pip install -r "$req"
          done

      - name: Run unit and API tests
        run: pytest services -q

  integration-tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: failsafe_app
      POSTGRES_PASSWORD: failsafe_ci_password
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: admin-ci-only
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Create CI service environment files
        run: bash scripts/ci/create-ci-envs.sh

      - name: Start local stack
        run: docker compose up -d --build

      - name: Apply migrations
        run: |
          docker compose exec -T auth-service alembic upgrade head
          docker compose exec -T product-service alembic upgrade head
          docker compose exec -T inventory-service alembic upgrade head
          docker compose exec -T order-service alembic upgrade head
          docker compose exec -T payment-service alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration -q

      - name: Show logs when something failed
        if: failure()
        run: docker compose logs --tail=100
      
      - name: Stop stack
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build all service images
        run: docker compose build 

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          for req in services/*/requirements.txt; do
            echo "Auditing $req"
            pip-audit -r "$req"
          done
      
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
    
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: services/auth-service
            image: failsafe-auth:ci
          - context: services/product-service
            image: failsafe-product:ci
          - context: services/inventory-service
            image: failsafe-inventory:ci
          - context: services/order-service
            image: failsafe-order:ci
          - context: services/payment-service
            image: failsafe-payment:ci
          - context: frontend
            image: failsafe-frontend:ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ${{ matrix.image }} ${{ matrix.context }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16.0"

      - name: Check whether Terraform exists
        id: tfcheck
        run: |
          if find terraform -type '*.tf' -print -quit | grep -q .; then
            echo "has_tf=true" >> "@GITHUB_OUTPUT"
          else
            echo "has_tf=false" >> "@GITHUB_OUTPUT"
          fi

      - name: Terraform format check
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: terraform fmt -check -recursive terraform

      - name: Validate environments
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: |
          for env in dev staging production; do
            if [ -d "terraform/environments/$env" ]; then
              terraform -chdir="terraform/environments/$env" init -backend=false input=false
              terraform -chdir="terraform/environments/$env" validate
            fi
          done
  
  ci.gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - frontend-check
      - unit-tests
      - integration-tests
      - docker-build
      - dependency-scan
      - secret-scan
      - container-scan
      - terraform-validate

    steps:
      - name: Verify require jobs
      run: |
        test "${{ needs.lint.result }}" = "success" 
        test "${{ needs.frontend-check.result }}" = "success"
        test "${{ needs.unit-tests.result }}" = "success"
        test "${{ needs.integration-tests.result }}" = "success"
        test "${{ needs.docker-build.result }}" = "success"
        test "${{ needs.dependency-scan.result }}" = "success"
        test "${{ needs.secret-scan.result }}" = "success"
        test "${{ needs.container-scan.result }}" = "success"
        test "${{ needs.terraform-validate.result }}" = "success"
        echo "All required jobs passed. CI gate passed."
            