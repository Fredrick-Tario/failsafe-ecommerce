---
- name: Allow SSH before enabling firewall
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto:  tcp

- name: Set default inbound policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outbound policy
  community.general.ufw:
    direction:  outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state:  enabled