---
- name: Install security packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Enable unattended upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true