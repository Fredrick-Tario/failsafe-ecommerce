---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: failsafe-dev
data:
  init.sql: |
    CREATE DATABASE failsafe_auth;
    CREATE DATABASE failsafe_product;
    CREATE DATABASE failsafe_inventory;
    CREATE DATABASE failsafe_order;
    CREATE DATABASE failsafe_payment;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: failsafe-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: failsafe-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: failsafe-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps_isready -U "$POSTGRES_USER"  -d  postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: postgres-init
          configMap:
            name: postgres-init
