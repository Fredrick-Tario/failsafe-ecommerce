apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: failsafe-frontend
spec:
  parentRefs:
    - name: failsafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value:  /
      backendRefs:
        - name: frontend-service
          port: 80

          